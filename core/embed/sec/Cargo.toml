[package]
name = "sec"
version = "0.0.0"
edition = "2024"
links = "sec"

[build-dependencies]
color-eyre.workspace = true
xbuild.workspace = true

[dependencies]
crypto.workspace = true
models.workspace = true
rtl.workspace = true
sys.workspace = true
trezor-storage = { workspace = true, optional = true }

[features]

# --------------------------------------------------------------------------
# MCU selection
# --------------------------------------------------------------------------

mcu_stm32f427 = ["sys/mcu_stm32f427", "mcu_stm32f4"]
mcu_stm32f429 = ["sys/mcu_stm32f429", "mcu_stm32f4"]
mcu_stm32u58 = ["sys/mcu_stm32u58", "mcu_stm32u5"]
mcu_stm32u5g = ["sys/mcu_stm32u5g", "mcu_stm32u5"]
mcu_stm32u5a = ["sys/mcu_stm32u5a", "mcu_stm32u5"]

# --------------------------------------------------------------------------
# Privilege mode
# --------------------------------------------------------------------------

kernel_mode = ["sys/kernel_mode"]
secure_mode = ["sys/secure_mode"]

# --------------------------------------------------------------------------
# Selectable components
# --------------------------------------------------------------------------

backup_ram = []
boot_ucb = ["sys/boot_ucb", "crypto/sphincsplus"]
bootloader_devel = []
consumption_mask = []
# The emulator always has bit access to flash, see sys/flash/build.rs.
emulator = ["sys/emulator", "trezor-storage?/bitwise", "trezor-storage?/emulator"]
hash_processor = []
hw_revision = []
iwdg = []
lockable_bootloader = ["sys/lockable_bootloader"]
mcu_attestation = ["crypto/mldsa"]
mldsa44 = ["crypto/mldsa"]
nrf_auth = []
optiga = ["sys/i2c_bus", "time_estimate", "trezor-storage?/optiga"]
optiga_testing = []
production = ["sys/production"]
rdi = []
secmon_verification = []
secret = []
secure_aes = []
storage = ["time_estimate", "dep:trezor-storage"]
storage_insecure_testing_mode = []
suspend = []
tamper = []
telemetry = ["backup_ram"]
time_estimate = []
tropic = ["trezor-storage?/tropic"]
tropic_logging = []
trustzone = ["sys/trustzone"]

# --------------------------------------------------------------------------
# Unit test configuration
# --------------------------------------------------------------------------

test = [
    "mcu_stm32u5g",
    "models/model_t3w1",
    "emulator",
    "kernel_mode",
    "secure_mode",
    "secret",
]

# --------------------------------------------------------------------------
# Automatically derived features (do not enable from outside)
# --------------------------------------------------------------------------

# Norcow layout, matching FLASH_BIT_ACCESS / FLASH_BLOCK_WORDS in
# sys/flash/build.rs. If both are enabled (STM32U5 emulator), `bitwise` wins.
mcu_stm32u5 = ["mcu_stm32", "trezor-storage?/blockwise", "trezor-storage?/hwkey"]
mcu_stm32f4 = ["mcu_stm32", "trezor-storage?/bitwise"]
mcu_stm32 = []
